<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project Environment Manager</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="container">
      <!-- Header -->
      <div class="header">
        <h1 class="logo">
          <span class="logo-icon">
            <img
              src="icons/icon-32.png"
              alt="Project Environment Manager Logo"
            />
          </span>
          Project Environment Manager
        </h1>
      </div>

      <!-- Tabs -->
      <div class="tabs">
        <button class="tab-btn active" data-tab="projects">Projects</button>
        <button class="tab-btn" data-tab="settings">Settings</button>
      </div>

      <!-- Projects Tab -->
      <div id="projects" class="tab-content active">
        <div class="add-section">
          <input
            type="text"
            id="projectInput"
            placeholder="Enter new project name..."
            class="input-field"
          />
          <button id="addProjectBtn" class="btn btn-primary">
            <span class="btn-icon">+</span> Add Project
          </button>
        </div>

        <div id="projectsContainer" class="projects-container">
          <!-- Projects will be dynamically loaded here -->
        </div>

        <div id="emptyState" class="empty-state">
          <div class="empty-icon">📭</div>
          <p>No projects yet. Create one to get started!</p>
        </div>
      </div>

      <!-- Settings Tab -->
      <div id="settings" class="tab-content">
        <div class="settings-section">
          <h3>Data Management</h3>
          <button id="exportBtn" class="btn btn-secondary">
            📥 Export Data
          </button>
          <button id="importBtn" class="btn btn-secondary">
            📤 Import Data
          </button>
          <button id="sampleBtn" class="btn btn-secondary">
            📥 Download Sample file
          </button>
          <button id="clearBtn" class="btn btn-danger">
            🗑️ Clear All Data
          </button>
        </div>
        <div class="settings-info">
          <p><strong>Tips:</strong></p>
          <ul>
            <li>Export your projects to backup your data</li>
            <li>Import previously exported data</li>
            <li>Clear all data will remove all projects and environments</li>
          </ul>
        </div>
      </div>
    </div>

    <!-- Modal for editing environment -->
    <div id="envModal" class="modal hidden">
      <div class="modal-content">
        <div class="modal-header">
          <h2 id="modalTitle">Add Environment</h2>
          <button class="modal-close">&times;</button>
        </div>
        <div class="modal-body">
          <input
            type="text"
            id="envName"
            placeholder="Environment name (e.g., Development)"
            class="input-field"
          />
          <input
            type="url"
            id="envUrl"
            placeholder="Environment URL (https://example.com)"
            class="input-field"
          />
          <label class="modal-label" for="envColor">Indicator color</label>
          <input
            type="color"
            id="envColor"
            value="#4ade80"
            class="input-field color-input"
          />
          <label class="status-label">
            <input type="checkbox" id="envActive" checked /> Active
          </label>
        </div>
        <div class="modal-footer">
          <button id="modalCancel" class="btn btn-secondary">Cancel</button>
          <button id="modalSave" class="btn btn-primary">Save</button>
        </div>
      </div>
    </div>

    <!-- Hidden file input for import -->
    <input type="file" id="fileInput" accept=".json" style="display: none" />

    <script src="popup.js"></script>
  </body>
</html>
